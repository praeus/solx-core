[package]
name = "solx-actions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Action store for solx: own database, execution (command/webhook/internal/WASM), file refs."

[dependencies]
solx-surface = { workspace = true }
solx-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
libsql = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
# Without a platform feature, keyring 3.x silently falls back to an
# in-memory mock store (writes vanish once the process exits) rather than
# erroring — enable all three native backends unconditionally, matching
# the crate's own docs.rs cross-platform build config; Cargo only pulls in
# each backend's deps on its matching `target_os`.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }
aes-gcm = "0.10"
axum = { workspace = true }
jsonwebtoken = "9"
anyhow = { workspace = true }
solx-files = { workspace = true }
solx-scripts = { workspace = true }
wasmtime = { version = "47", features = ["component-model"] }
wasmtime-wasi = "47"
# For `FutureExt::catch_unwind` around guest execution — `spawn_blocking`
# used to absorb panics via JoinError and no longer does. Already in the
# tree via wasmtime's default `component-model-async` feature.
futures = { workspace = true }

[dev-dependencies]
solx-types = { workspace = true }
solx-docs = { workspace = true }
tempfile = "3"
serial_test = "3"
