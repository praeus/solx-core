[package]
name = "solx-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP (Model Context Protocol) server exposing solx documents, types, files, and actions as tools to LLM clients over stdio."

[[bin]]
name = "solx-mcp"
path = "src/main.rs"

[dependencies]
solx-manager = { workspace = true }
solx-surface = { workspace = true }
solx-config = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.0.0", features = ["server", "transport-io"] }

[dev-dependencies]
tempfile = "3"
# Extra features for the in-process client/server integration test only —
# additive on top of the binary's own "server"/"transport-io" features for
# `cargo test`, not part of the shipped `solx-mcp` binary.
rmcp = { version = "3.0.0", features = ["client"] }
