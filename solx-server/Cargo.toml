[package]
name = "solx-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP server hosting the local solx managers, so multiple solx-cli/solx-mcp processes can share one appdata dir concurrently."

[[bin]]
name = "solx-server"
path = "src/main.rs"

[dependencies]
solx-manager = { workspace = true }
solx-surface = { workspace = true }
solx-config = { workspace = true }
# Only for `set_long_lived_host` — everything else about action execution
# stays behind `solx-manager`'s `App`/`Solx` facade.
solx-actions = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
solx-client = { workspace = true }
tempfile = "3"
