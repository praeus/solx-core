[package]
name = "solx-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP server hosting the local solx managers, so multiple solx-cli/solx-mcp processes can share one appdata dir concurrently."

[[bin]]
name = "solx-server"
path = "src/main.rs"

[dependencies]
solx-manager = { workspace = true }
solx-surface = { workspace = true }
solx-config = { workspace = true }
# Only for `set_long_lived_host` — everything else about action execution
# stays behind `solx-manager`'s `App`/`Solx` facade.
solx-actions = { workspace = true }
# `streamable_http_service()` — mounts the same `SolxMcpServer` the stdio
# `solx-mcp` binary uses, as an MCP-over-HTTP route sharing this process's
# `Arc<App>`. See routes/mcp.rs.
solx-mcp = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
solx-client = { workspace = true }
tempfile = "3"
# MCP client, for the /mcp Streamable HTTP integration test only — not part
# of the shipped `solx-server` binary (which only needs `solx-mcp`'s server
# side, pulled in as a normal dependency above).
rmcp = { version = "3.0.0", features = ["client", "transport-streamable-http-client-reqwest"] }
# Test-only, to register a Script action's artifact directly for the
# progress-notification test — same use as `solx-mcp`'s own dev-dependency.
solx-files = { workspace = true }
