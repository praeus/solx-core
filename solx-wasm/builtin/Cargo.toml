[package]
name    = "sol-actions"
version = "0.1.0"
edition = "2021"

# This crate is a WASM Component Model library included in the main workspace.
# It is built for wasm targets explicitly during bootstrap.
#
# Build (backend component):
#   cargo build --target wasm32-wasip2 --release
#   → target/wasm32-wasip2/release/sol_actions.wasm
#
# Build (frontend component — no host imports):
#   cargo build --target wasm32-unknown-unknown --release --no-default-features
#
# After building, register the binary as a sol Artifact named "sol-actions.wasm"
# and create the corresponding Action records with bin_name="sol-actions.wasm".

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["backend"]
# backend: enables imports of document-ops and logger (for wasmtime hosting)
backend = []

[dependencies]
wit-bindgen = "0.36"
serde_json  = { version = "1", default-features = false, features = ["alloc"] }
